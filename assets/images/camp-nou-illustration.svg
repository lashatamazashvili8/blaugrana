  </defs>
  <rect width="600" height="340" fill="url(#stadiumSky)"/>
  <!-- Floodlights -->
  <circle cx="80" cy="50" r="40" fill="#EDBB00" opacity="0.15"/>
  <circle cx="520" cy="50" r="40" fill="#EDBB00" opacity="0.15"/>
  <polygon points="70,40 90,40 160,240 40,240" fill="#FFFFFF" opacity="0.08"/>
  <polygon points="510,40 530,40 560,240 440,240" fill="#FFFFFF" opacity="0.08"/>
  <!-- Grandstand Tiers -->
  <path d="M 50 200 Q 300 130 550 200 L 580 270 Q 300 220 20 270 Z" fill="#003870"/>
  <path d="M 60 215 Q 300 155 540 215 L 560 250 Q 300 205 40 250 Z" fill="#A50044"/>
  <!-- Pitch -->
  <ellipse cx="300" cy="275" rx="260" ry="55" fill="#1A7A4A"/>
  <!-- Pitch markings -->
  <ellipse cx="300" cy="275" rx="55" ry="18" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  <line x1="40" y1="275" x2="560" y2="275" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
</svg>
